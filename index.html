<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Green In Action</title>
  <meta name="description" content="เปลี่ยนเรื่องรักษ์โลกให้เป็นการลงมือทำ! มาเรียนรู้วิธีสื่อสารเรื่องสีเขียวให้สนุก" />
  <meta name="theme-color" content="#0f7a4a" />
  <meta property="og:title" content="greeninaction.space" />
  <meta property="og:description" content="เปลี่ยนเรื่องรักษ์โลกให้เป็นการลงมือทำ! มาเรียนรู้วิธีสื่อสารเรื่องสีเขียวให้สนุก" />
  <meta property="og:image" content="assets/logo.png" />
  <link rel="icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <!-- Hero: ปกซ้อนกันหลายชั้น (ท้องฟ้า เมฆ กังหันลม เนินเขา โลโก้) รูปอยู่ใน assets/ -->
    <header class="hero">
      <div class="scene" aria-hidden="true">
        <img class="sky" src="assets/sky.webp" alt="" />
        <img class="cloud cloud--1" src="assets/cloud-1.webp" alt="" />
        <img class="cloud cloud--2" src="assets/cloud-2.webp" alt="" />
        <img class="cloud cloud--3" src="assets/cloud-3.webp" alt="" />
        <img class="cloud cloud--4" src="assets/cloud-4.webp" alt="" />

        <div class="turbine turbine--1"><img class="tower" src="assets/tower.webp" alt="" /><img class="rotor" src="assets/rotor.webp" alt="" /></div>
        <div class="turbine turbine--2"><img class="tower" src="assets/tower.webp" alt="" /><img class="rotor" src="assets/rotor.webp" alt="" /></div>
        <div class="turbine turbine--3"><img class="tower" src="assets/tower.webp" alt="" /><img class="rotor" src="assets/rotor.webp" alt="" /></div>
        <div class="turbine turbine--4"><img class="tower" src="assets/tower.webp" alt="" /><img class="rotor" src="assets/rotor.webp" alt="" /></div>

        <img class="hills" src="assets/hills.webp" alt="" />

        <span class="sparkle sparkle--1">✦</span>
        <span class="sparkle sparkle--2">✦</span>
        <span class="sparkle sparkle--3">✦</span>
        <span class="sparkle sparkle--4">✦</span>
      </div>

      <img class="logo" src="assets/logo.webp" alt="Green In Action" />

      <a class="icon-btn icon-btn--left" href="#" aria-label="หน้าแรก">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M11 2h2v7.6l5.4-5.4 1.4 1.4L14.4 11H22v2h-7.6l5.4 5.4-1.4 1.4-5.4-5.4V22h-2v-7.6l-5.4 5.4-1.4-1.4L9.6 13H2v-2h7.6L4.2 5.6l1.4-1.4L11 9.6z"/>
        </svg>
      </a>
      <button class="icon-btn icon-btn--right" type="button" id="share-btn" aria-label="แชร์">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>
        </svg>
      </button>
    </header>

    <section class="profile">
      <h1 class="title">greeninaction.space</h1>
      <p class="bio">
        เปลี่ยนเรื่องรักษ์โลกให้เป็นการลงมือทำ! มาเรียนรู้วิธีสื่อสารเรื่องสีเขียวให้สนุก 💚 กดลงทะเบียนที่ลิงก์เลย 👇
      </p>

      <nav class="socials" aria-label="โซเชียล">
        <!-- แก้ลิงก์ Instagram / TikTok ตรงนี้ -->
        <a href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </a>
        <a href="https://www.tiktok.com/" target="_blank" rel="noopener" aria-label="TikTok">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true">
            <path d="M16.6 2h-3.4v13.3a3 3 0 1 1-3-3c.3 0 .6 0 .9.1V8.9a6.5 6.5 0 1 0 5.5 6.4V8.6a8 8 0 0 0 4.4 1.4V6.6a4.5 4.5 0 0 1-4.4-4.6z"/>
          </svg>
        </a>
      </nav>
    </section>

    <section class="links" aria-label="ลิงก์">
      <!-- แก้ href ของแต่ละปุ่มตรงนี้ -->
      <a class="link-card" href="#" target="_blank" rel="noopener">
        <span class="thumb thumb--plain">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <circle cx="12" cy="12" r="11" fill="#000"/><path d="M12 7v10M7 12h10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="label">ลงทะเบียนเข้าร่วมงานสัมมนา</span>
        <span class="more" aria-hidden="true">⋮</span>
      </a>

      <a class="link-card" href="https://www.instagram.com/" target="_blank" rel="noopener">
        <span class="thumb thumb--ig">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff" stroke="none"/>
          </svg>
        </span>
        <span class="label">Instagram</span>
        <span class="more" aria-hidden="true">⋮</span>
      </a>

      <a class="link-card" href="https://www.tiktok.com/" target="_blank" rel="noopener">
        <span class="thumb thumb--tt">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
            <path d="M16.6 2h-3.4v13.3a3 3 0 1 1-3-3c.3 0 .6 0 .9.1V8.9a6.5 6.5 0 1 0 5.5 6.4V8.6a8 8 0 0 0 4.4 1.4V6.6a4.5 4.5 0 0 1-4.4-4.6z" fill="#25f4ee" transform="translate(-.8 -.6)"/>
            <path d="M16.6 2h-3.4v13.3a3 3 0 1 1-3-3c.3 0 .6 0 .9.1V8.9a6.5 6.5 0 1 0 5.5 6.4V8.6a8 8 0 0 0 4.4 1.4V6.6a4.5 4.5 0 0 1-4.4-4.6z" fill="#fe2c55" transform="translate(.8 .6)"/>
            <path d="M16.6 2h-3.4v13.3a3 3 0 1 1-3-3c.3 0 .6 0 .9.1V8.9a6.5 6.5 0 1 0 5.5 6.4V8.6a8 8 0 0 0 4.4 1.4V6.6a4.5 4.5 0 0 1-4.4-4.6z" fill="#fff"/>
          </svg>
        </span>
        <span class="label">TikTok</span>
        <span class="more" aria-hidden="true">⋮</span>
      </a>
    </section>

    <footer class="footer">© Green In Action</footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const toast = document.getElementById('toast');
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast.t);
      showToast.t = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    document.getElementById('share-btn').addEventListener('click', async () => {
      const data = { title: document.title, url: location.href };
      try {
        if (navigator.share) {
          await navigator.share(data);
        } else {
          await navigator.clipboard.writeText(location.href);
          showToast('คัดลอกลิงก์แล้ว');
        }
      } catch (_) { /* ผู้ใช้กดยกเลิก */ }
    });

    // ปุ่ม ⋮ บนการ์ด: คัดลอกลิงก์ของการ์ดนั้น
    document.querySelectorAll('.link-card .more').forEach((el) => {
      el.addEventListener('click', async (e) => {
        e.preventDefault();
        e.stopPropagation();
        try {
          await navigator.clipboard.writeText(el.closest('a').href);
          showToast('คัดลอกลิงก์แล้ว');
        } catch (_) {}
      });
    });
  </script>
</body>
</html>
